<title>Pornire si meniul goMotion</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Trei stari, un singur fundal: praful ramane vizibil tot timpul, iar
     suprafetele sunt translucide peste el.
       intrare  -> lockup in centru, bara de incarcare
       meniu    -> alegerile stanga, marca vie dreapta (side by side)
       ecran    -> ecranul dedicat categoriei alese, singur pe scena
     Lockup-ul e acelasi obiect in toate trei: se muta, nu se redeseneaza. */
  :root {
    --text: #eef1ff;
    --t2: #a3acd0;
    --t3: #7d87ab;
    --linie: rgba(120,140,200,.22);
    --linie-slaba: rgba(120,140,200,.12);
    --sticla: rgba(13,19,36,.52);
    --sticla-tare: rgba(10,15,30,.74);
    --before: #fbbf24;
    --after: #22d3ee;
    --pe-accent: #1a1200;
    --ok: #3ddc97;
    --f-ui: 'Outfit', system-ui, -apple-system, sans-serif;
    --f-mono: 'JetBrains Mono', ui-monospace, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(circle at 50% 46%, #0a1122 0%, #060b18 58%, #050811 100%);
    color: var(--text);
    font: 400 14px/1.55 var(--f-ui);
    overflow: hidden; user-select: none; -webkit-font-smoothing: antialiased;
  }
  #scena { position: relative; height: 100%; width: 100%; }
  #praf {
    position: absolute; inset: 0; width: 100%; height: 100%;
    opacity: 0; transition: opacity 1.1s ease-out;
  }
  #praf.pe { opacity: 1; }

  /* ---------- straturile ---------- */
  .strat {
    position: absolute; inset: 0;
    opacity: 0; pointer-events: none;
    transition: opacity .5s ease-out;
    padding: clamp(18px, 3vh, 34px) max(20px, env(safe-area-inset-right, 0px))
             calc(clamp(18px, 3vh, 34px) + env(safe-area-inset-bottom, 0px))
             max(20px, env(safe-area-inset-left, 0px));
  }
  .strat.pe { opacity: 1; pointer-events: auto; }

  /* ---------- lockup ---------- */
  #strat-marca { position: absolute; inset: 0; z-index: 30; pointer-events: none; display: grid; place-items: center; }
  #coloana-intrare { display: flex; flex-direction: column; align-items: center; gap: clamp(18px, 2.6vh, 28px); }
  #lockup {
    --word: clamp(2.5rem, 6.2vw, 5.2rem);
    display: flex; flex-direction: column; align-items: center; gap: .55em;
    transform-origin: center center;
    transition: transform .9s cubic-bezier(.2,.9,.2,1);
    will-change: transform;
  }
  #rand-marca { display: inline-flex; align-items: center; gap: calc(var(--word) * .06); }
  #rand-marca .par {
    font: 600 calc(var(--word) * .54)/1 var(--f-mono);
    color: rgba(34,211,238,.72); text-shadow: 0 0 14px rgba(34,211,238,.4);
    transform: translateY(-.06em);
  }
  #glifa-g {
    display: inline-flex; align-items: center;
    opacity: 0; transform: translateX(26px) scale(.86); filter: blur(5px);
    transition: opacity .8s cubic-bezier(.16,1,.3,1), transform .8s cubic-bezier(.16,1,.3,1), filter .8s;
  }
  #glifa-g.pe { opacity: 1; transform: none; filter: none; }
  #glifa-g .g {
    font: 800 calc(var(--word) * .98)/1 var(--f-mono);
    background: linear-gradient(145deg, #fff 24%, #fde68a 50%, #fbbf24 70%, #22d3ee 93%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    padding: .16em .04em .30em; margin: -.16em 0 -.30em;
  }
  #cuib-sfera {
    position: relative; flex: none;
    width: calc(var(--word) * .68); height: calc(var(--word) * .68);
    top: calc(var(--word) * .06);
    opacity: 0; transform: scale(.2) rotate(-28deg);
    transition: opacity 1s cubic-bezier(.16,1,.3,1), transform 1s cubic-bezier(.16,1,.3,1);
  }
  #cuib-sfera.pe { opacity: 1; transform: none; }
  #sfera { position: absolute; top: 50%; left: 50%; width: 196%; height: 196%; transform: translate(-50%,-50%); }
  #cuvant { display: inline-flex; align-items: baseline; font: 700 var(--word)/1 var(--f-ui); letter-spacing: -.03em; }
  #cuvant span {
    display: inline-block; padding: .16em 0 .30em; margin: -.16em 0 -.30em;
    background: linear-gradient(175deg, #fff 22%, #f1f5f9 60%, #bae6fd 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    opacity: 0; transform: translateY(14px) translateX(-12px) scale(.93); filter: blur(5px);
    transition: opacity .62s cubic-bezier(.16,1,.3,1), transform .62s cubic-bezier(.16,1,.3,1), filter .62s;
  }
  #cuvant span.pe { opacity: 1; transform: none; filter: none; }
  #tagline {
    font: 600 calc(var(--word) * .158)/1 var(--f-mono);
    letter-spacing: .26em; text-transform: uppercase; color: rgba(148,163,184,.8);
    white-space: nowrap; opacity: 0; transition: opacity .6s ease-out;
  }
  #tagline.pe { opacity: 1; }
  #tagline .a { color: var(--before); } #tagline .c { color: var(--after); }

  /* ---------- bara de incarcare ---------- */
  #incarcare { width: min(360px, 70vw); display: grid; gap: .55rem; justify-items: center; opacity: 0; transition: opacity .5s ease-out; }
  #incarcare.pe { opacity: 1; }
  #sina { width: 100%; height: 2px; background: rgba(120,140,200,.18); border-radius: 2px; overflow: hidden; }
  #umple { height: 100%; width: 0%; background: linear-gradient(90deg, var(--before), #fff 55%, var(--after)); box-shadow: 0 0 12px rgba(251,191,36,.5); }
  #stare-incarcare { font: 600 10.5px/1 var(--f-mono); letter-spacing: .22em; text-transform: uppercase; color: var(--t3); display: flex; gap: .8rem; align-items: baseline; }
  #stare-incarcare b { color: var(--before); font-weight: 600; font-variant-numeric: tabular-nums; }

  /* ---------- meniul: side by side ---------- */
  #meniu { z-index: 20; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: clamp(20px, 4vw, 56px); align-items: center; }
  #alegeri { display: flex; flex-direction: column; gap: 10px; min-width: 0; max-width: 540px; justify-self: end; width: 100%; }
  .titlu-grup { font: 600 10px/1 var(--f-mono); letter-spacing: .24em; text-transform: uppercase; color: var(--t3); margin-bottom: 4px; }
  .alegere {
    display: flex; align-items: center; gap: 14px; text-align: left; cursor: pointer;
    padding: 14px 16px; border-radius: 11px; min-width: 0;
    border: 1px solid var(--linie-slaba); background: var(--sticla);
    color: inherit; font: inherit;
    opacity: 0; transform: translateX(-14px);
    transition: opacity .45s ease-out, transform .45s cubic-bezier(.2,.9,.2,1),
                border-color .16s, background .16s;
  }
  .alegere.intrat { opacity: 1; transform: none; }
  .alegere:hover { border-color: rgba(120,140,200,.4); background: rgba(22,32,60,.62); }
  .alegere:focus-visible, .alegere.tinta { outline: 2px solid var(--after); outline-offset: 2px; }
  .alegere.acum { border-color: rgba(251,191,36,.45); box-shadow: inset 3px 0 0 var(--before); }
  .tasta {
    width: 26px; height: 26px; flex: none; border-radius: 7px;
    border: 1px solid var(--linie); display: grid; place-items: center;
    font: 600 11px/1 var(--f-mono); color: var(--t3);
  }
  .alegere.acum .tasta { background: var(--before); border-color: var(--before); color: var(--pe-accent); }
  .text-al { min-width: 0; display: grid; gap: 2px; }
  .text-al b { font: 600 16px/1.2 var(--f-ui); }
  .text-al span { font: 400 12px/1.35 var(--f-mono); color: var(--t3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .insigna { margin-left: auto; flex: none; font: 600 9px/1 var(--f-mono); letter-spacing: .14em; color: var(--t3); border: 1px solid var(--linie); border-radius: 4px; padding: 4px 5px; }
  .insigna.viu { color: var(--before); border-color: rgba(251,191,36,.45); }

  #marca-dreapta { display: flex; flex-direction: column; align-items: center; gap: 26px; min-width: 0; }
  #slot-meniu { width: min(430px, 40vw); height: clamp(84px, 12vh, 132px); flex: none; }
  #banda-stare { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; font: 400 11.5px/1 var(--f-mono); color: var(--t3); }
  #banda-stare i { font-style: normal; display: inline-flex; align-items: center; gap: 7px; }
  .bec { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 7px rgba(61,220,151,.6); }
  .bec.cald { background: var(--before); box-shadow: 0 0 7px rgba(251,191,36,.6); }
  #taste-meniu { position: absolute; left: 0; right: 0; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); text-align: center; font: 400 10.5px/1 var(--f-mono); letter-spacing: .16em; color: var(--t3); }

  /* ---------- ecranul dedicat ---------- */
  #ecran { z-index: 22; display: flex; flex-direction: column; gap: 18px; }
  #antet-ecran { display: flex; align-items: center; gap: 14px; flex: none; min-height: 40px; }
  #slot-antet { width: 132px; height: 24px; flex: none; }
  #inapoi {
    display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
    background: var(--sticla); border: 1px solid var(--linie-slaba); border-radius: 8px;
    color: var(--t2); font: 400 12px/1 var(--f-mono); padding: 8px 11px;
  }
  #inapoi:hover { color: #fff; border-color: rgba(120,140,200,.42); }
  #inapoi:focus-visible { outline: 2px solid var(--after); outline-offset: 2px; }
  #titlu-ecran { font: 600 18px/1 var(--f-ui); margin: 0 0 0 4px; letter-spacing: -.01em; }
  .chip { font: 600 9.5px/1 var(--f-mono); letter-spacing: .14em; padding: 5px 7px; border-radius: 5px; border: 1px solid var(--linie); color: var(--t2); }
  .chip.b { color: var(--before); border-color: rgba(251,191,36,.4); }
  .chip.a { color: var(--after); border-color: rgba(34,211,238,.4); }
  #corp-ecran { flex: 1; min-height: 0; overflow: auto; display: grid; gap: 16px; align-content: start; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); }
  .zona { border: 1px solid var(--linie-slaba); border-radius: 11px; background: var(--sticla); padding: 15px 17px 16px; min-width: 0; }
  .zona.lata { grid-column: 1 / -1; }
  .zona h2 { font: 600 11px/1 var(--f-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--t3); margin: 0 0 12px; }
  .perechi { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  .parte { border: 1px solid var(--linie-slaba); border-radius: 9px; padding: 12px 13px; min-width: 0; background: rgba(8,13,26,.4); }
  .parte.b { border-top: 2px solid var(--before); } .parte.a { border-top: 2px solid var(--after); }
  .parte h3 { margin: 0 0 10px; font: 600 10.5px/1 var(--f-mono); letter-spacing: .18em; }
  .parte.b h3 { color: var(--before); } .parte.a h3 { color: var(--after); }
  .camp { display: grid; gap: 4px; margin-bottom: 9px; }
  .camp:last-child { margin-bottom: 0; }
  .camp label { font: 400 9.5px/1 var(--f-mono); letter-spacing: .12em; color: var(--t3); }
  .camp .val { border: 1px solid var(--linie-slaba); border-radius: 6px; background: rgba(5,9,20,.6); padding: 8px 10px; font: 400 12px/1.2 var(--f-mono); color: var(--t2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rand-recent { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--linie-slaba); min-width: 0; }
  .rand-recent:last-child { border-bottom: 0; }
  .rand-recent .cale { font: 400 12px/1.3 var(--f-mono); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rand-recent .nr { flex: none; font: 600 10.5px/1 var(--f-mono); color: var(--before); font-variant-numeric: tabular-nums; }
  .rand-recent .cand { margin-left: auto; flex: none; font: 400 10.5px/1 var(--f-mono); color: var(--t3); }
  pre.cmd { margin: 0; padding: 11px 13px; border-radius: 8px; background: rgba(5,9,20,.66); border: 1px solid var(--linie-slaba); overflow-x: auto; font: 400 11.5px/1.65 var(--f-mono); color: var(--t2); }
  pre.cmd b { color: var(--after); font-weight: 400; }
  .buton-mare { height: 40px; padding: 0 20px; border: 0; border-radius: 9px; cursor: pointer; background: var(--before); color: var(--pe-accent); font: 600 14px/1 var(--f-ui); display: inline-flex; align-items: center; gap: 9px; }
  .buton-mare span { font: 400 11px/1 var(--f-mono); opacity: .7; }
  .buton-mare:focus-visible { outline: 2px solid var(--after); outline-offset: 3px; }
  .ramuri { display: grid; gap: 9px; margin: 0; padding: 0; list-style: none; }
  .ramuri li { display: flex; align-items: center; gap: 10px; font: 400 12.5px/1.4 var(--f-mono); color: var(--t2); }
  .ramuri li::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--t3); flex: none; }
  .ramuri li s { margin-left: auto; text-decoration: none; font-size: 9.5px; letter-spacing: .14em; color: var(--t3); border: 1px solid var(--linie); border-radius: 4px; padding: 3px 5px; }
  .explic { margin: 0 0 14px; font-size: 13.5px; color: var(--t2); max-width: 62ch; }

  /* ---------- unelte ale machetei ---------- */
  #unelte { position: absolute; z-index: 40; right: 14px; bottom: 14px; display: flex; gap: 8px; padding-right: env(safe-area-inset-right, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  #unelte button { font: 400 11px/1 var(--f-mono); color: var(--t2); cursor: pointer; background: var(--sticla-tare); border: 1px solid var(--linie); border-radius: 6px; padding: 7px 9px; }
  #unelte button:hover { color: #fff; }
  #sari { position: absolute; z-index: 40; left: 0; right: 0; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); text-align: center; font: 400 10.5px/1 var(--f-mono); letter-spacing: .14em; color: var(--t3); opacity: 0; transition: opacity .4s; }
  #sari.pe { opacity: 1; }

  @media (max-width: 900px) {
    #meniu { grid-template-columns: 1fr; align-content: center; gap: 26px; }
    #alegeri { justify-self: center; max-width: 480px; }
    #marca-dreapta { order: -1; }
    #slot-meniu { width: min(360px, 76vw); height: 92px; }
  }
  @media (max-width: 560px) {
    .alegere { padding: 11px 12px; gap: 11px; }
    .text-al span { display: none; }
    #banda-stare { font-size: 10.5px; gap: 12px; }
    #corp-ecran { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    #praf, #glifa-g, #cuib-sfera, #cuvant span, #incarcare, #tagline, .strat, .alegere, #lockup { transition-duration: 1ms !important; }
  }
</style>

<div id="scena">
  <canvas id="praf" aria-hidden="true"></canvas>

  <!-- ---------------- meniul: alegerile stanga, marca dreapta ---------------- -->
  <section class="strat" id="meniu" aria-hidden="true">
    <div id="alegeri">
      <div class="titlu-grup">Ce facem</div>
      <button class="alegere acum" type="button" data-ecran="comparare">
        <span class="tasta">1</span>
        <span class="text-al"><b>Comparare obiecte</b><span>before fata de after</span></span>
        <span class="insigna viu">ACUM</span>
      </button>
      <button class="alegere" type="button" data-ecran="kit">
        <span class="tasta">2</span>
        <span class="text-al"><b>Kit SQL pe baza</b><span>un script de livrare, pus pe baza</span></span>
        <span class="insigna">IN CURAND</span>
      </button>
      <button class="alegere" type="button" data-ecran="analiza">
        <span class="tasta">3</span>
        <span class="text-al"><b>Analiza initiala</b><span>ce s-a personalizat intr-o baza</span></span>
        <span class="insigna">IN CURAND</span>
      </button>
      <button class="alegere" type="button" data-ecran="config">
        <span class="tasta">4</span>
        <span class="text-al"><b>Configurare</b><span>conexiuni, aspect, jurnal</span></span>
        <span class="insigna">IN CURAND</span>
      </button>
    </div>

    <div id="marca-dreapta">
      <div id="slot-meniu" aria-hidden="true"></div>
      <div id="banda-stare">
        <i><span class="bec"></span>SRV-DEV, 38 ms</i>
        <i><span class="bec"></span>jurnal 2,1 MB</i>
        <i><span class="bec cald"></span>ultimul deploy: 41 / 2</i>
      </div>
    </div>

    <div id="taste-meniu">1&ndash;4 ALEGE &nbsp;&middot;&nbsp; ENTER DESCHIDE &nbsp;&middot;&nbsp; ESC INCHIDE</div>
  </section>

  <!-- ---------------- ecranul dedicat ---------------- -->
  <section class="strat" id="ecran" aria-hidden="true">
    <div id="antet-ecran">
      <button id="inapoi" type="button">&larr; Meniu <span style="opacity:.6">Esc</span></button>
      <div id="slot-antet" aria-hidden="true"></div>
      <h1 id="titlu-ecran">Comparare obiecte</h1>
      <span class="chip b" id="chip-b">BEFORE</span>
      <span class="chip a" id="chip-a">AFTER</span>
    </div>
    <div id="corp-ecran"></div>
  </section>

  <!-- ---------------- lockup: acelasi obiect in toate starile ---------------- -->
  <div id="strat-marca">
    <div id="coloana-intrare">
      <div id="lockup">
        <div id="rand-marca">
          <span class="par" aria-hidden="true">&lt;</span>
          <span id="glifa-g" aria-hidden="true"><span class="g">g</span></span>
          <span id="cuib-sfera"><canvas id="sfera"></canvas></span>
          <span id="cuvant" aria-label="goMotion"></span>
          <span class="par" aria-hidden="true">/&gt;</span>
        </div>
        <div id="tagline" aria-hidden="true"><span class="a">BEFORE</span> // <span class="c">T-SQL DIFF ENGINE</span> // <span class="c">AFTER</span></div>
      </div>

      <div id="incarcare" aria-hidden="true">
        <div id="sina"><div id="umple"></div></div>
        <div id="stare-incarcare"><span id="pas-text">pornesc</span><b id="pas-pct">0%</b></div>
      </div>
    </div>
  </div>

  <div id="sari" aria-hidden="true">ORICE TASTA SARE PESTE</div>
  <div id="unelte">
    <button id="btn-reia" type="button">Reia intrarea</button>
    <button id="btn-meniu" type="button">Sari la meniu</button>
  </div>
</div>

<script>
(function () {
  'use strict';
  var REDUS = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var lockup  = document.getElementById('lockup');
  var cuvant  = document.getElementById('cuvant');
  var glifa   = document.getElementById('glifa-g');
  var cuib    = document.getElementById('cuib-sfera');
  var tagline = document.getElementById('tagline');
  var incarc  = document.getElementById('incarcare');
  var umple   = document.getElementById('umple');
  var pasText = document.getElementById('pas-text');
  var pasPct  = document.getElementById('pas-pct');
  var sariEl  = document.getElementById('sari');
  var meniu   = document.getElementById('meniu');
  var ecran   = document.getElementById('ecran');
  var corpEc  = document.getElementById('corp-ecran');
  var titluEc = document.getElementById('titlu-ecran');
  var chipB   = document.getElementById('chip-b');
  var chipA   = document.getElementById('chip-a');
  var slotMen = document.getElementById('slot-meniu');
  var slotAnt = document.getElementById('slot-antet');
  var prafCv  = document.getElementById('praf');
  var sferaCv = document.getElementById('sfera');
  var alegeri = Array.prototype.slice.call(document.querySelectorAll('.alegere'));

  'Motion'.split('').forEach(function (ch, i) {
    var s = document.createElement('span');
    s.textContent = ch;
    s.style.transitionDelay = (i * 0.055) + 's';
    cuvant.appendChild(s);
  });
  var litere = Array.prototype.slice.call(cuvant.querySelectorAll('span'));

  var PASI = [
    { p: 0.18, t: 'citesc configurarea' },
    { p: 0.44, t: 'pornesc motorul de comparare' },
    { p: 0.68, t: 'deschid sesiunile salvate' },
    { p: 0.88, t: 'caut servere' },
    { p: 1.00, t: 'gata' }
  ];

  // ---------------------------------------------------------------- ecranele
  var ECRANE = {
    comparare: {
      titlu: 'Comparare obiecte', roluri: true,
      corp:
        '<div class="zona lata" style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">' +
          '<button class="buton-mare" type="button">Conecteaza <span>Enter</span></button>' +
          '<span style="font-size:13px;color:var(--t2)">sau reia o comparare de mai jos</span>' +
        '</div>' +
        '<div class="zona lata"><h2>Conectare</h2><div class="perechi">' +
          '<div class="parte b"><h3>BEFORE</h3>' +
            '<div class="camp"><label>SERVER</label><div class="val">SRV-DEV</div></div>' +
            '<div class="camp"><label>BAZA</label><div class="val">ERP_TEST</div></div></div>' +
          '<div class="parte a"><h3>AFTER</h3>' +
            '<div class="camp"><label>SERVER</label><div class="val">SRV-DEV</div></div>' +
            '<div class="camp"><label>BAZA</label><div class="val">ERP_PROD</div></div></div>' +
        '</div></div>' +

    n1.addColorStop(0, 'rgba(245,158,11,0.06)'); n1.addColorStop(1, 'rgba(5,8,17,0)');
    g.fillStyle = n1; g.fillRect(0, 0, latP, inaltP);
    var n2 = g.createRadialGradient(latP * 0.84, inaltP * 0.18, 10, latP * 0.84, inaltP * 0.18, Math.max(latP, inaltP) * 0.55);
    n2.addColorStop(0, 'rgba(34,211,238,0.06)'); n2.addColorStop(1, 'rgba(5,8,17,0)');
    g.fillStyle = n2; g.fillRect(0, 0, latP, inaltP);

    // campul departat: trei dale, ca sa acopere coltii cand deriva
    if (camp) {
      g.save();
      g.translate(latP / 2, inaltP / 2);
      g.rotate(INCLINARE);
      g.translate(-campW / 2, -campH / 2);
      var off = (t * 2.6) % campW; if (off < 0) off += campW;
      g.globalAlpha = 0.95;
      g.drawImage(camp, -off - campW, 0);
      g.drawImage(camp, -off, 0);
      g.drawImage(camp, campW - off, 0);
      g.globalAlpha = 1;
      g.restore();
    }

    for (var i = 0; i < boabe.length; i++) {
      var p = boabe[i];
      var px = p.x + t * p.vx; px -= Math.floor(px);
      var py = p.y + Math.sin(t * p.fy + p.phy) * p.ay;
      var tw = 0.38 + 0.62 * Math.sin(t * p.tws + p.tw);
      var a = p.baza * tw;
      if (a < 0.025) continue;
      var X = px * latP, Y = py * inaltP;
      g.fillStyle = p.cald ? 'rgba(255,214,130,' + a.toFixed(3) + ')' : 'rgba(170,236,252,' + a.toFixed(3) + ')';
      if (p.mare) { g.beginPath(); g.arc(X, Y, 2.4 * (0.8 + 0.4 * tw), 0, 6.2832); g.fill(); }
      else { g.fillRect(X | 0, Y | 0, 1, 1); }
    }
    g.restore();
    deseneazaStea(t);
  }

  // ------------------------------------------------- mutarea lockup-ului
  // Masura netransformata se ia o singura data: citita in fiecare cadru, ar
  // reporni tranzitia la nesfarsit si lockup-ul ar ramane inghetat pe loc.
  var baza = null;
  function masoaraBaza() {
    var tr = lockup.style.transition, tf = lockup.style.transform;
    lockup.style.transition = 'none';
    lockup.style.transform = 'none';
    baza = lockup.getBoundingClientRect();
    lockup.style.transform = tf;
    void lockup.offsetWidth;
    lockup.style.transition = tr;
  }
  // Straturile doar se sting si se aprind (fara translatie), deci locul
  // fiecarui slot e acelasi si cand stratul lui e invizibil.
  function asaza(slot) {
    if (!slot) { lockup.style.transform = 'none'; return; }
    if (!baza || !baza.width) masoaraBaza();
    var b = slot.getBoundingClientRect();
    if (!baza.width || !b.width) return;
    var k = Math.min(b.width / baza.width, b.height / baza.height);
    var dx = (b.left + b.width / 2) - (baza.left + baza.width / 2);
    var dy = (b.top + b.height / 2) - (baza.top + baza.height / 2);
    lockup.style.transform = 'translate(' + dx.toFixed(1) + 'px,' + dy.toFixed(1) + 'px) scale(' + k.toFixed(4) + ')';
  }

  // ---------------------------------------------------------------- regia
  function alege(i) {
    ales = Math.max(0, Math.min(alegeri.length - 1, i));
    alegeri.forEach(function (el, j) { el.classList.toggle('tinta', j === ales); });
    alegeri[ales].focus({ preventScroll: true });
  }

  function laMeniu() {
    if (stare === 'meniu') return;
    var dinIntrare = stare === 'intrare';
    curata();
    stare = 'meniu';
    progres = 1;
    umple.style.width = '100%';
    incarc.classList.remove('pe');
    sariEl.classList.remove('pe');
    ecran.classList.remove('pe'); ecran.setAttribute('aria-hidden', 'true');
    tagline.classList.add('pe');
    if (dinIntrare) lovituraLa = performance.now() * 0.001;

    dupa(dinIntrare ? 240 : 0, function () {
      meniu.classList.add('pe'); meniu.setAttribute('aria-hidden', 'false');
      masoaraBaza();
      requestAnimationFrame(function () { asaza(slotMen); });
      alegeri.forEach(function (el, i) {
        el.classList.remove('intrat');
        dupa(dinIntrare ? 320 + i * 85 : i * 55, function () { el.classList.add('intrat'); });
      });
        dupa(dinIntrare ? 700 : 160, function () { alege(ales); });
      urmatoarea = performance.now() * 0.001 + (dinIntrare ? 4.5 : 2.5);
    });
  }

  function laEcran(cheie) {
    var e = ECRANE[cheie];
    if (!e) return;
    curata();
    stare = 'ecran';
    titluEc.textContent = e.titlu;
    corpEc.innerHTML = e.corp;
    corpEc.scrollTop = 0;
    chipB.hidden = !e.roluri; chipA.hidden = !e.roluri;
    meniu.classList.remove('pe'); meniu.setAttribute('aria-hidden', 'true');
    ecran.classList.add('pe'); ecran.setAttribute('aria-hidden', 'false');
    tagline.classList.remove('pe');      // la 132 px, tagline-ul ar fi o pata
    asaza(slotAnt);
    document.getElementById('inapoi').focus({ preventScroll: true });
  }

  function joacaIntrarea() {
    curata();
    stare = 'intrare';
    progres = 0; lovituraLa = -99; ales = 0;
    stea = null; impactLa = -99; urmatoarea = 1e9;
    t0 = performance.now() * 0.001;

    meniu.classList.remove('pe'); meniu.setAttribute('aria-hidden', 'true');
    ecran.classList.remove('pe'); ecran.setAttribute('aria-hidden', 'true');
    alegeri.forEach(function (el) { el.classList.remove('intrat', 'tinta'); });

    lockup.style.transition = 'none';
    lockup.style.transform = 'none';
    void lockup.offsetWidth;
    lockup.style.transition = '';
    baza = null;

    glifa.classList.remove('pe');
    cuib.classList.remove('pe');
    litere.forEach(function (l) { l.classList.remove('pe'); });
    tagline.classList.remove('pe');
    incarc.classList.remove('pe');
    umple.style.transition = 'none'; umple.style.width = '0%';
    void umple.offsetWidth;
    umple.style.transition = 'width .5s cubic-bezier(.4,.9,.3,1)';
    pasText.textContent = 'pornesc'; pasPct.textContent = '0%';

    prafCv.classList.add('pe');
    dupa(220,  function () { cuib.classList.add('pe'); });
    dupa(700,  function () { glifa.classList.add('pe'); });
    dupa(830,  function () { litere.forEach(function (l) { l.classList.add('pe'); }); });
    dupa(1450, function () { tagline.classList.add('pe'); });
    dupa(1600, function () { incarc.classList.add('pe'); sariEl.classList.add('pe'); });
    PASI.forEach(function (pas, i) {
      dupa(1750 + i * 420, function () {
        progres = pas.p;
        umple.style.width = (pas.p * 100) + '%';
        pasText.textContent = pas.t;
        pasPct.textContent = Math.round(pas.p * 100) + '%';
      });
    });
    dupa(1750 + PASI.length * 420 + 320, laMeniu);
  }

  // ---------------------------------------------------------------- bucla
  function cadru(ms) {
    var t = ms * 0.001;
    deseneazaPraf(t);
    deseneazaSfera(t);
    requestAnimationFrame(cadru);
  }

  function masoara() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    masoaraPraf(); masoaraSfera();
    if (stare !== 'intrare') { masoaraBaza(); asaza(stare === 'meniu' ? slotMen : slotAnt); }
  }

  // ---------------------------------------------------------------- intrari
  window.addEventListener('resize', masoara);
  alegeri.forEach(function (el, i) {
    el.addEventListener('click', function () { ales = i; laEcran(el.dataset.ecran); });
    el.addEventListener('mouseenter', function () { if (stare === 'meniu') alege(i); });
  });
  document.getElementById('inapoi').addEventListener('click', laMeniu);
  document.getElementById('btn-reia').addEventListener('click', joacaIntrarea);
  document.getElementById('btn-meniu').addEventListener('click', laMeniu);
  document.getElementById('scena').addEventListener('click', function (e) {
    if (stare === 'intrare' && !e.target.closest('#unelte')) laMeniu();
  });
  window.addEventListener('keydown', function (e) {
    if (stare === 'intrare') { e.preventDefault(); laMeniu(); return; }
    if (stare === 'ecran') { if (e.key === 'Escape') { e.preventDefault(); laMeniu(); } return; }
    if (e.key >= '1' && e.key <= '4') { e.preventDefault(); alege(+e.key - 1); return; }
    if (e.key === 'ArrowDown') { e.preventDefault(); alege(ales + 1); return; }
    if (e.key === 'ArrowUp') { e.preventDefault(); alege(ales - 1); return; }
    if (e.key === 'Enter') { e.preventDefault(); laEcran(alegeri[ales].dataset.ecran); }
  });

  masoara();
  joacaIntrarea();
  requestAnimationFrame(cadru);
  window.goMotion = { reia: joacaIntrarea, meniu: laMeniu, ecran: laEcran };
})();
</script>
