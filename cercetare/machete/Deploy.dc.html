<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<title>Planul de deploy</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#2b4a6f}a:hover{color:#1c1b18}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; flex-direction: column; background: #f5f4f0; color: #1c1b18; font-family: 'IBM Plex Sans', 'Segoe UI', sans-serif; font-size: 13px; overflow: hidden;">
  <div style="height: 3px; flex-shrink: 0; background: #b3261e;"></div>

  <header style="height: 48px; flex-shrink: 0; display: flex; align-items: center; gap: 14px; padding: 0 16px; border-bottom: 1px solid #dedbd3; background: #fbfaf7;">
    <a href="Main.dc.html" style="color: #6b675e; text-decoration: none; display: inline-flex; align-items: center; gap: 6px;">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#6b675e" stroke-width="1.5" aria-hidden="true"><path d="M10 3L5 8l5 5"/></svg>Listă
    </a>
    <span style="width: 1px; height: 20px; background: #dedbd3;"></span>
    <span style="font-weight: 600; font-size: 14px;">Deploy pe CharismaProd</span>
    <span style="font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 11px; font-weight: 600; color: #b3261e; letter-spacing: 0.6px;">PROD</span>
    <span style="color: #6b675e; font-size: 12px;">din CharismaDev · plan făcut la 14:41</span>
  </header>

  <div style="flex-grow: 1; min-height: 0; display: flex;">
    <main style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; background: #fbfaf7;">
      <div role="tablist" aria-label="Plan" style="height: 40px; flex-shrink: 0; display: flex; align-items: flex-end; gap: 22px; padding: 0 24px; border-bottom: 1px solid #dedbd3;">
        <button role="tab" aria-selected="true" style="height: 40px; padding: 0; border: 0; border-bottom: 2px solid #1c1b18; background: transparent; color: #1c1b18; font-weight: 600; font-size: 13px;">Ordinea</button>
        <button role="tab" style="height: 40px; padding: 0; border: 0; border-bottom: 2px solid transparent; background: transparent; color: #6b675e; font-size: 13px;">Atenționări <span style="font-family: 'IBM Plex Mono', Consolas, monospace; color: #8a5a00;">2</span></button>
        <button role="tab" style="height: 40px; padding: 0; border: 0; border-bottom: 2px solid transparent; background: transparent; color: #6b675e; font-size: 13px;">Script <span style="font-family: 'IBM Plex Mono', Consolas, monospace;">1.412</span></button>
      </div>

      <div style="padding: 20px 24px 10px; display: flex; align-items: baseline; gap: 14px;">
        <span style="font-size: 18px; font-weight: 600;">12 obiecte</span>
        <span style="color: #6b675e;"><span style="color: #8a5a00;">9 modificate</span>, <span style="color: #3d6b35;">2 noi</span>, <span style="color: #a3392b;">1 șters</span> — în ordinea în care se folosesc unul pe altul</span>
      </div>

      <div role="list" style="margin: 0 24px; border-top: 1px solid #1c1b18;">
        <sc-for list="{{pasi}}" as="p" hint-placeholder-count="12">
          <div role="listitem" style="{{p.sty}}">
            <span style="font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 12px; color: #9c978b; text-align: right;">{{p.n}}</span>
            <span style="{{p.opSty}}">{{p.op}}</span>
            <span style="font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 12.5px;"><span style="color: #9c978b;">{{p.schema}}.</span>{{p.obj}}</span>
            <span style="{{p.notaSty}}">{{p.nota}}</span>
          </div>
        </sc-for>
      </div>
    </main>

    <aside aria-label="Verificări și rulare" style="width: 400px; flex-shrink: 0; border-left: 1px solid #dedbd3; display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; gap: 16px;">
      <div style="font-weight: 600;">Înainte de rulare</div>
      <div style="display: flex; flex-direction: column; gap: 12px;">
        <sc-for list="{{verif}}" as="v" hint-placeholder-count="5">
          <div style="display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; line-height: 1.45;">
            <span style="{{v.icSty}}" aria-label="{{v.stare}}">{{v.ic}}</span>
            <div><span style="font-weight: 500;">{{v.titlu}}</span> <span style="color: #6b675e;">{{v.det}}</span></div>
          </div>
        </sc-for>
      </div>

      <label style="display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; line-height: 1.45; padding-top: 16px; border-top: 1px solid #dedbd3;">
        <input type="checkbox" checked="{{true}}" style="margin: 3px 0 0; accent-color: #1c1b18;">
        <span>Salvează întâi versiunea actuală a celor 12 obiecte, ca să poți reveni.</span>
      </label>

      <div style="flex-grow: 1;"></div>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <label for="confirma" style="line-height: 1.45;">E producție și se șterge un obiect. Scrie <span style="font-family: 'IBM Plex Mono', Consolas, monospace; font-weight: 600;">CharismaProd</span> ca să pornești.</label>
        <input id="confirma" style="height: 32px; padding: 0 10px; border: 1px solid #b3261e; border-radius: 3px; font-size: 13px; font-family: 'IBM Plex Mono', Consolas, monospace; background: #ffffff;">
        <div style="display: flex; gap: 8px;">
          <button style="height: 32px; padding: 0 12px; border: 1px solid #dedbd3; border-radius: 3px; background: #ffffff; color: #1c1b18; font-size: 13px;">Salvează .sql</button>
          <button disabled="{{true}}" style="flex-grow: 1; height: 32px; border: 0; border-radius: 3px; background: #d9d5cc; color: #6b675e; font-weight: 500; font-size: 13px;">Rulează</button>
        </div>
      </div>
    </aside>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
const OPC = { ALTER: '#8a5a00', CREATE: '#3d6b35', DROP: '#a3392b' };
class Component extends DCLogic {
  renderVals() {
    const P = [
      ['CREATE', 'dbo', 'fn_StocLot', 'nouă, o folosește pasul 4', ''],
      ['ALTER', 'dbo', 'fn_PretCuTva', 'o folosește pasul 3', ''],
      ['ALTER', 'dbo', 'vw_FacturiNeincasate', '', ''],
      ['ALTER', 'dbo', 'usp_CalculeazaStoc', '', ''],
      ['CREATE', 'dbo', 'usp_ImportClienti', '', ''],
      ['ALTER', 'dbo', 'GenerateOrderByRecommendedOrder', '', ''],
      ['ALTER', 'dbo', 'usp_InchideLuna', 'rămâne cu QUOTED_IDENTIFIER OFF', 'w'],
      ['ALTER', 'rpt', 'usp_RaportVanzariLunar', '', ''],
      ['ALTER', 'dbo', 'trg_Comenzi_Audit', 'diferă doar setarea SET', ''],
      ['ALTER', 'dbo', 'usp_Facturare', 'rămâne cu QUOTED_IDENTIFIER OFF', 'w'],
      ['ALTER', 'dbo', 'usp_ExportAnaf', '', ''],
      ['DROP', 'dbo', 'fn_CursVechi', 'nu mai e în sursă', 'd'],
    ];
    const pasi = P.map(([op, schema, obj, nota, f], i) => ({
      n: i + 1, op, schema, obj, nota,
      opSty: "font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 11.5px; font-weight: 600; letter-spacing: 0.4px; color: " + OPC[op],
      notaSty: 'font-size: 12.5px; color: ' + (f === 'd' ? '#a3392b' : f === 'w' ? '#8a5a00' : '#6b675e'),
      sty: 'display: grid; grid-template-columns: 22px 64px minmax(0, 1fr) 280px; align-items: center; gap: 12px; height: 34px; border-bottom: 1px solid #ebe8e1',
    }));
    const glif = (s) => s === 'ok'
      ? { ic: '✓', stare: 'în regulă', icSty: "font-family: 'IBM Plex Mono', Consolas, monospace; font-weight: 600; color: #3d6b35" }
      : { ic: '!', stare: 'atenție', icSty: "font-family: 'IBM Plex Mono', Consolas, monospace; font-weight: 600; color: #8a5a00; padding-left: 3px" };
    const verif = [
      ['ok', 'SQL Server 2016 SP2.', 'Știe CREATE OR ALTER; scriptul se oprește singur pe unul mai vechi.'],
      ['ok', 'Baza n-a mai fost atinsă.', 'Recitită acum 30 s, cele 12 obiecte sunt exact cum le-ai comparat.'],
      ['ok', 'Ordinea e completă.', 'Nicio dependență circulară.'],
      ['w', 'Se șterge dbo.fn_CursVechi.', 'Nimic din bază n-o mai folosește.'],
      ['w', 'Două proceduri au QUOTED_IDENTIFIER OFF.', 'Setarea li se păstrează.'],
    ].map(([s, titlu, det]) => Object.assign(glif(s), { titlu, det }));
    return { pasi, verif };
  }
}
</script>
</body>
</html>
