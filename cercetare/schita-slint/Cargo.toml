# Schita de fezabilitate pentru directiile Harta (lista) si Panza (editorul).
# NU face parte din workspace-ul aplicatiei: e cercetare, nu cod livrat.
# Foloseste motorul adevarat (gmotion-fereastra::model_editor) ca sa dovedeasca
# ca designul se poate desena in Slint, cu randarea software.
[workspace]

[package]
name = "schita-slint"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
gmotion-core = { path = "../../rust/core" }
gmotion-fereastra = { path = "../../rust/fereastra" }
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "software-renderer-systemfonts"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1"

[build-dependencies]
slint-build = "1.19"
