<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1b2a"/>
      <stop offset="50%" style="stop-color:#1a3a5c"/>
      <stop offset="100%" style="stop-color:#0969da"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#26a641;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#4fc3f7;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#26a641;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <!-- Grid lines subtile -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="320" y1="0" x2="320" y2="1080"/>
    <line x1="640" y1="0" x2="640" y2="1080"/>
    <line x1="960" y1="0" x2="960" y2="1080"/>
    <line x1="1280" y1="0" x2="1280" y2="1080"/>
    <line x1="1600" y1="0" x2="1600" y2="1080"/>
    <line x1="0" y1="270" x2="1920" y2="270"/>
    <line x1="0" y1="540" x2="1920" y2="540"/>
    <line x1="0" y1="810" x2="1920" y2="810"/>
  </g>
  <!-- Linie accent orizontala -->
  <rect x="0" y="535" width="1920" height="10" rx="0" fill="url(#glow)"/>
  <!-- Logo GMotion centrat -->
  <text x="960" y="460" font-family="'Segoe UI',Arial,sans-serif" font-size="160" font-weight="900"
        text-anchor="middle" fill="white" opacity="0.12" letter-spacing="20">GMOTION</text>
  <!-- Text principal -->
  <text x="960" y="510" font-family="'Segoe UI',Arial,sans-serif" font-size="72" font-weight="900"
        text-anchor="middle" fill="white" letter-spacing="8">GMotion</text>
  <text x="960" y="580" font-family="'Segoe UI',Arial,sans-serif" font-size="28" font-weight="400"
        text-anchor="middle" fill="#4fc3f7" letter-spacing="4" opacity="0.9">SQL Diff &amp; Deploy Platform</text>
  <!-- Indicatori diff jos -->
  <g transform="translate(760,650)">
    <rect width="18" height="18" rx="3" fill="#ff4444"/>
    <text x="28" y="14" font-family="'Segoe UI',Arial" font-size="16" fill="#aaa">Modificat</text>
  </g>
  <g transform="translate(920,650)">
    <rect width="18" height="18" rx="3" fill="#26a641"/>
    <text x="28" y="14" font-family="'Segoe UI',Arial" font-size="16" fill="#aaa">Adaugat</text>
  </g>
  <g transform="translate(1070,650)">
    <rect width="18" height="18" rx="3" fill="#ffd93d"/>
    <text x="28" y="14" font-family="'Segoe UI',Arial" font-size="16" fill="#aaa">Sters</text>
  </g>
</svg>
