[workspace]
resolver = "2"
members = ["core", "db", "platforma", "module/diff-obiecte", "cli", "fereastra", "app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Minimul **real**, nu unul dorit: `uuid` (prin `tiberius`) cere 1.89, iar
# `fereastra` si `app` cer 1.95 (Slint). Poarta verifica declaratia asta fata
# de ce cer dependentele — 1.74 era fals de mult, si `db` nici nu se construia
# pe el (F-B1 din auditul QA).
rust-version = "1.89"
license = "UNLICENSED"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
