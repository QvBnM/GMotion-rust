[package]
name = "gmotion-core"
description = "Motorul de comparare a obiectelor SQL. Logica pura: fara I/O, fara UI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
regex = "1"
once_cell = "1"
md-5 = "0.10"
sha2 = "0.10"
hex = "0.4"

# Testele de conformitate si exemplul de bench citesc fixture-uri JSON din
# rust/referinta/. Exemplele au acces la dev-dependencies, deci serde_json nu
# trebuie sa fie dependinta normala.
[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
