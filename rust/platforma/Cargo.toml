[package]
name = "gmotion-platforma"
description = "Ce e comun tuturor modulelor: configurare, sesiuni, jurnal, registru de module si rutare."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
gmotion-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
